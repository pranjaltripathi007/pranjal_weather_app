<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Tripathi Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(120deg, #6a11cb, #2575fc);
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header .logo {
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f7d354;
        }
        header nav {
            display: flex;
            gap: 20px;
        }
        header nav a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }
        header nav a:hover {
            color: #f7d354;
        }
        .main-content {
            flex: 1;
            text-align: center;
            padding: 60px 20px;
        }
        .main-content h1 {
            font-size: 40px;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease;
        }
        .main-content p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            animation: fadeIn 1.5s ease;
        }
        .contact-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .contact-form {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .contact-form h2 {
            font-size: 22px;
            color: #f7d354;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .contact-form form input, .contact-form form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #fff;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            transition: background 0.3s, border 0.3s;
        }
        .contact-form form input:focus, .contact-form form textarea:focus {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #f7d354;
        }
        .contact-form form button {
            background: linear-gradient(90deg, #f7d354, #fcb045);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .contact-form form button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
            background: linear-gradient(90deg, #fcb045, #f7d354);
        }
        footer {
            background: rgba(0, 0, 0, 0.8);
            color: #f7d354;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
        }
        footer a {
            color: #fcb045;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }

        /* Animations */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            header .logo {
                margin-bottom: 10px;
            }
            header nav {
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }
            .main-content h1 {
                font-size: 32px;
            }
            .main-content p {
                font-size: 14px;
            }
            .contact-form {
                padding: 15px;
            }
        }
        @media (max-width: 480px) {
            header {
                padding: 15px 20px;
            }
            .main-content h1 {
                font-size: 28px;
            }
            .contact-form form input, .contact-form form textarea {
                font-size: 12px;
                padding: 10px;
            }
            .contact-form form button {
                font-size: 14px;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Tripathi Weather App</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="weather.html">Weather</a>
        </nav>
    </header>
    <div class="main-content">
        <h1>Contact Us</h1>
        <p>We’d love to hear from you! Please feel free to get in touch with any questions or feedback.</p>
        <div class="contact-container">
            <div class="contact-form">
                <h2>Send us a Message</h2>
                <form>
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" placeholder="Your Message" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </div>
    <footer>
        &copy; 2025 Tripathi Weather App | Designed with ❤️ | <a href="#">Privacy Policy</a>
    </footer>
</body>
</html>
